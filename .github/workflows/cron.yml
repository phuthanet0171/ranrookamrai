# Calls the web app's /api/cron every 15 minutes so automation rules run on time
# (Vercel's free plan only allows one cron run per day).
# Set two repository secrets: APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET.
# GitHub may delay scheduled runs by a few minutes; /api/cron runs every rule that is due,
# so a late call still sends today's messages, and never twice.
name: Automations tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set"; exit 1
          fi
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
